plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aamb.cornermask'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aamb.cornermask'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
